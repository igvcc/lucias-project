[workspace]
resolver = "2"
members = [
    "crates/pe_native_patcher",
    "crates/shims/shim_common",
    "crates/shims/xmem_pc",
    "crates/shims/xcrd_pc",
    "crates/shims/ffx_pc",
    "crates/shims/dx12xs_pc",
    "crates/shims/xg_pc",
    "crates/shims/xbvh_pc",
    "crates/shims/chad_pc",
    "crates/shims/audio_pc",
    "crates/shims/bink2_pc",
    "crates/shims/hc_pc",
    "crates/shims/gi_pc",
    "crates/shims/gameinput_shim",
    "crates/shims/vfs_pc",
    "crates/xgameruntime_pc",
    "crates/shim_integration_tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Security",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
object = { version = "0.41.0", default-features = false, features = ["read_core", "pe", "std"] }
